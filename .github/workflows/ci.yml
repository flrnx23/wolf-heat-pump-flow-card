name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify source
        run: npm run check

      - name: Build card
        run: npm run build

      - name: Upload bundle
        uses: actions/upload-artifact@v4
        with:
          name: wolf-heat-pump-flow-card
          path: |
            dist/wolf-heat-pump-flow-card.js
            dist/wolf-heat-pump-flow-card.js.map
          if-no-files-found: error
